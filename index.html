<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Predictor • RNG‑Aware Sampling</title>
    <style>
:root {
        --bg-deep: #05050e;
        --bg-card: #0c0c1a;
        --bg-card2: #111125;
        --bg-input: #08081a;
        --text-primary: #eaeaef;
        --text-secondary: #9fa0b8;
        --text-muted: #63657a;
        --accent-cyan: #00d4ff;
        --accent-magenta: #ff2d78;
        --accent-purple: #9b5fff;
        --accent-gold: #ffb347;
        --accent-green: #3dfcb4;
        --border-subtle: #1e1e38;
        --radius-lg: 20px;
        --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
        --font-sans: 'Inter', system-ui, sans-serif;
    }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg-deep);
            font-family: var(--font-sans);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 660px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .app-header {
            text-align: center;
        }
        .app-title {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #8ebfff, #9b5fff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 18px rgba(155,95,255,0.5));
        }
        .app-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .stats-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .stat-pill {
            background: var(--bg-card2);
            border: 1px solid var(--border-subtle);
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 0.72rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .stat-value {
            font-weight: 700;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.78rem;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 20px 22px;
            backdrop-filter: blur(8px);
            position: relative;
        }
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, transparent 60%, rgba(0,180,255,0.015));
            pointer-events: none;
            z-index: 0;
        }
        .card > * {
            position: relative;
            z-index: 1;
        }
        .input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 110px;
        }
        .input-group label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            font-weight: 600;
        }
        .input-group input {
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        .input-group input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 16px rgba(0,212,255,0.3);
        }
        .input-group input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            cursor: pointer;
        }
        .btn {
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            border: none;
            transition: all 0.25s ease;
            font-family: var(--font-sans);
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, #007bb5, #00b8f0);
            color: #fff;
            box-shadow: 0 4px 18px rgba(0,180,240,0.4);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 26px rgba(0,200,255,0.6);
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            background: #333;
            box-shadow: none;
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #2c2c50;
            color: var(--text-secondary);
        }
        .btn-secondary:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }
        .btn-secondary.active {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            background: rgba(0,212,255,0.08);
        }
        .btn-danger {
            background: transparent;
            border: 1px solid rgba(255,68,88,0.4);
            color: #ff4458;
        }
        .btn-danger:hover {
            background: rgba(255,68,88,0.12);
        }
        .btn-edit {
            background: transparent;
            border: 1px solid rgba(255,179,71,0.4);
            color: #ffb347;
        }
        .btn-edit:hover {
            background: rgba(255,179,71,0.1);
        }
        .btn-edit.active {
            background: rgba(255,179,71,0.15);
            border-color: #ffb347;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 0.7rem;
            border-radius: 20px;
        }
        .prediction-card {
            text-align: center;
            padding: 26px 18px;
        }
        .prediction-value {
            font-size: 5rem;
            font-weight: 900;
            font-family: var(--font-mono);
            background: linear-gradient(180deg, #ffffff, #c8d5ff 70%, #8ea0e0);
            animation: glowPulse 2.8s ease-in-out infinite;
            line-height: 1;
            border-radius: 10px;
        }
        @keyframes glowPulse {
            0%,100% {
                filter: drop-shadow(0 0 38px rgba(180,200,255,0.8));
            }

            50% {
                filter: drop-shadow(0 0 60px rgba(200,220,255,1));
            }
        }
        .no-prediction {
            font-size: 1.4rem;
            font-weight: 500;
            background: none;
            -webkit-text-fill-color: var(--text-muted);
            filter: none;
            animation: none;
        }
        .confidence-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .confidence-bar-outer {
            width: 130px;
            height: 5px;
            background: #1a1a30;
            border-radius: 10px;
            overflow: hidden;
        }
        .confidence-bar-inner {
            height: 100%;
            border-radius: 10px;
            transition: width 0.6s ease;
        }
        .model-badge {
            display: inline-block;
            background: rgba(0,212,255,0.12);
            border: 1px solid rgba(0,212,255,0.4);
            border-radius: 20px;
            padding: 3px 14px;
            font-size: 0.65rem;
            color: var(--accent-cyan);
            margin-top: 6px;
            letter-spacing: 0.05em;
        }
        .reroll-btn {
            background: transparent;
            border: 1px solid rgba(255,179,71,0.5);
            color: #ffb347;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .reroll-btn:hover {
            background: rgba(255,179,71,0.15);
        }
        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            background: var(--bg-card2);
            border-radius: 8px;
            border: 1px solid transparent;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .history-item:hover {
            border-color: #2c2c50;
        }
        .history-item.editable {
            cursor: pointer;
            border-color: rgba(255,179,71,0.35);
        }
        .history-item.editable:hover {
            border-color: #ffb347;
        }
        .history-item.selected-for-edit {
            border-color: #ffb347!important;
            background: #1e1a20!important;
        }
        .history-index {
            font-size: 0.6rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            min-width: 28px;
        }
        .history-value {
            font-family: var(--font-mono);
            font-weight: 700;
            flex: 1;
        }
        .history-time {
            font-size: 0.6rem;
            color: var(--text-muted);
        }
        .history-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .history-item.editable .history-actions, .history-item:hover .history-actions {
            opacity: 1;
        }
        .btn-inline-edit, .btn-inline-delete {
            padding: 2px 8px;
            font-size: 0.6rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-inline-edit {
            background: rgba(255,179,71,0.2);
            border: 1px solid rgba(255,179,71,0.5);
            color: #ffb347;
        }
        .btn-inline-delete {
            background: rgba(255,68,88,0.2);
            border: 1px solid rgba(255,68,88,0.5);
            color: #ff4458;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 0.76rem;
            font-weight: 600;
            animation: toastIn 0.4s ease, toastOut 0.3s ease 2.2s forwards;
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(60px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }

            to {
                opacity: 0;
                transform: translateX(60px);
            }
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: var(--bg-card);
            border: 1px solid #2c2c50;
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 420px;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <div class="toast-container" id="toastContainer"></div>

    <div class="app-container">
        <header class="app-header">
            <h1 class="app-title">Algorithm Predictor</h1>
            <p class="app-subtitle">
                RNG‑Aware Probabilistic Engine
            </p>
        </header>

        <div class="stats-grid">
            <div class="stat-pill">
                <span>📊 Count</span><span class="stat-value" id="statCount">0</span>
            </div>
            <div class="stat-pill">
                <span>📈 Median</span><span class="stat-value" id="statMedian">—</span>
            </div>
            <div class="stat-pill">
                <span>🎯 Mode</span><span class="stat-value" id="statMode">—</span>
            </div>
            <div class="stat-pill">
                <span>📉 StdDev</span><span class="stat-value" id="statStd">—</span>
            </div>
            <div class="stat-pill">
                <span>🔄 Entropy</span><span class="stat-value" id="statEntropy">—</span>
            </div>
            <div class="stat-pill">
                <span>🔁 Autocorr</span><span class="stat-value" id="statAutocorr">—</span>
            </div>
        </div>

        <div class="card">
            <div class="input-row">
                <div class="input-group">
                    <label for="numberInput">Number (≥1.00)</label>
                    <input type="number" id="numberInput" step="0.01" min="1.00" placeholder="e.g. 2.75">
                </div>
                <div class="input-group" style="max-width:120px;">
                    <label for="limitInput">Upper Bound</label>
                    <input type="number" id="limitInput" min="1" step="1" placeholder="Max" disabled>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="infinityCheckbox" checked>
                    <span>∞ No bound</span>
                </div>
            </div>
            <div style="margin-top:12px;display:flex;gap:10px;align-items:center;">
                <button class="btn btn-primary" id="submitBtn">🚀 Submit</button>
                <span id="limitStatus" style="font-size:0.68rem;color:var(--text-muted);"></span>
            </div>
        </div>

        <div class="card prediction-card">
            <div class="prediction-label">
                🔮 Most Probable Next Value
            </div>
            <div class="prediction-value no-prediction" id="predictionValue">
                Need 16 entries
            </div>
            <div class="model-badge" id="modelBadge" style="display:none;">
                mode: <span id="modelText">—</span>
            </div>
            <div class="confidence-row" id="confidenceRow" style="display:none;">
                <span style="font-size:0.7rem;color:var(--text-muted);">Confidence</span>
                <div class="confidence-bar-outer">
                    <div class="confidence-bar-inner" id="confidenceBar" style="width:0%;background:var(--accent-green);"></div>
                </div>
                <span style="font-size:0.7rem;color:var(--text-muted);" id="confidencePercent">0%</span>
            </div>
            <button class="reroll-btn" id="rerollBtn" style="display:none;">🎲 Re‑roll Prediction</button>
            <div style="font-size:0.65rem;color:var(--text-muted);margin-top:4px;" id="detailHint"></div>
        </div>

        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);">📋 History</span>
                <span id="historyRangeLabel" style="font-size:0.62rem;color:var(--text-muted);">Latest 10</span>
            </div>
            <ul class="history-list" id="historyList">
                <li style="text-align:center;color:var(--text-muted);padding:30px;">No data</li>
            </ul>
            <div style="display:flex;gap:8px;margin-top:12px;justify-content:center;">
                <button class="btn btn-secondary btn-sm" id="viewToggleBtn">🔍 View 32</button>
                <button class="btn btn-edit btn-sm" id="editToggleBtn">✏️ Edit Mode</button>
                <button class="btn btn-danger btn-sm" id="clearBtn">🗑 Clear All</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="editModal" style="display:none;">
        <div class="modal">
            <h3>✏️ Edit Submission</h3>
            <p>
                New value for <strong id="editModalIndex"></strong>
            </p>
            <input type="number" id="editModalInput" step="0.01" min="1.00">
            <div style="display:flex;gap:10px;justify-content:center;margin-top:12px;">
                <button class="btn btn-primary btn-sm" id="editModalSave">Save</button>
                <button class="btn btn-secondary btn-sm" id="editModalCancel">Cancel</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal" style="display:none;">
        <div class="modal">
            <h3>⚠️ Clear All?</h3>
            <p>
                <strong id="confirmCount"></strong> entries will be erased.
            </p>
            <div style="display:flex;gap:10px;justify-content:center;">
                <button class="btn btn-danger" id="confirmYes">Yes, Clear</button>
                <button class="btn btn-secondary" id="confirmNo">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        (() => {
            // ── DOM ──
            const numberInput = document.getElementById('numberInput');
            const limitInput = document.getElementById('limitInput');
            const infinityCheckbox = document.getElementById('infinityCheckbox');
            const submitBtn = document.getElementById('submitBtn');
            const limitStatus = document.getElementById('limitStatus');
            const predictionValue = document.getElementById('predictionValue');
            const confidenceRow = document.getElementById('confidenceRow');
            const confidenceBar = document.getElementById('confidenceBar');
            const confidencePercent = document.getElementById('confidencePercent');
            const modelBadge = document.getElementById('modelBadge');
            const modelText = document.getElementById('modelText');
            const rerollBtn = document.getElementById('rerollBtn');
            const detailHint = document.getElementById('detailHint');
            const historyList = document.getElementById('historyList');
            const historyRangeLabel = document.getElementById('historyRangeLabel');
            const viewToggleBtn = document.getElementById('viewToggleBtn');
            const editToggleBtn = document.getElementById('editToggleBtn');
            const clearBtn = document.getElementById('clearBtn');
            const statCount = document.getElementById('statCount');
            const statMedian = document.getElementById('statMedian');
            const statMode = document.getElementById('statMode');
            const statStd = document.getElementById('statStd');
            const statEntropy = document.getElementById('statEntropy');
            const statAutocorr = document.getElementById('statAutocorr');
            const toastContainer = document.getElementById('toastContainer');
            const editModal = document.getElementById('editModal');
            const editModalIndex = document.getElementById('editModalIndex');
            const editModalInput = document.getElementById('editModalInput');
            const editModalSave = document.getElementById('editModalSave');
            const editModalCancel = document.getElementById('editModalCancel');
            const confirmModal = document.getElementById('confirmModal');
            const confirmCount = document.getElementById('confirmCount');
            const confirmYes = document.getElementById('confirmYes');
            const confirmNo = document.getElementById('confirmNo');

            let history = [];
            let isViewing32 = false, isEditMode = false, editTarget = null;

            // prediction state for re‑roll
            let lastPredictionState = null; // { mode: 'deterministic'|'random', linearPred: number, kdePoints: array of {x, density}, kdeCdf: array of {x, cumProb}, upperBound, entropy, lag1, confidence }

            // Particles
            const canvas = document.getElementById('particleCanvas'), ctx = canvas.getContext('2d');
            let particles = [];
            function resizeCanvas() {
                canvas.width = innerWidth; canvas.height = innerHeight;
            }
            resizeCanvas(); window.addEventListener('resize', resizeCanvas);
            class Particle {
                constructor() {
                    this.reset(); this.y = Math.random() * canvas.height;
                }
                reset() {
                    this.x = Math.random() * canvas.width; this.y = -10; this.size = Math.random() * 2 + 0.5; this.speedY = Math.random() * 0.3 + 0.1; this.speedX = (Math.random() - 0.5) * 0.2; this.opacity = Math.random() * 0.5 + 0.15;
                }
                update() {
                    this.y += this.speedY; this.x += this.speedX; if (this.y > canvas.height + 15 || this.x < -15 || this.x > canvas.width + 15) this.reset();
                }
                draw() {
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fillStyle = `hsla(210,70%,65%,${this.opacity})`; ctx.fill();
                }
            }
            for (let i = 0; i < 55; i++) particles.push(new Particle());
            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => {
                    p.update(); p.draw();
                }); requestAnimationFrame(animateParticles);
            }
            animateParticles();

            function showToast(msg, type = 'info') {
                const t = document.createElement('div'); t.className = `toast toast-${type}`; t.textContent = msg; toastContainer.appendChild(t); setTimeout(() => t.remove(), 2500);
            }

            const fmt = v => Number(v).toFixed(2);
            const nowTime = () => new Date().toLocaleTimeString('en-US', {
                hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'
            });

            function getVisible() {
                const total = history.length;
                if (!total) return [];
                const n = isViewing32 ? Math.min(32, total): Math.min(10, total);
                const start = total - n;
                return history.slice(start).map((h, i) => ({
                    ...h, gi: start + i
                })).reverse();
            }

            // ── Core prediction engine ──
            function buildPredictionState() {
                const vals = history.map(h => h.value);
                const n = vals.length;
                if (n < 4) return null;

                let upper = Infinity;
                if (!infinityCheckbox.checked) {
                    const lim = parseInt(limitInput.value); if (lim >= 1) upper = lim;
                }

                const sorted = [...vals].sort((a, b) => a - b);
                const mean = vals.reduce((s, v) => s + v, 0) / n;
                const std = Math.sqrt(vals.reduce((s, v) => s + (v - mean) ** 2, 0) / n);

                const binCount = Math.min(20, Math.max(5, Math.floor(Math.sqrt(n) * 1.5)));
                const minV = sorted[0],
                maxV = sorted[n - 1],
                range = maxV - minV || 1;
                const binWidth = range / binCount;
                const bins = Array.from({
                    length: binCount
                }, (_, i) => ({
                        low: minV + i * binWidth, high: minV + (i + 1) * binWidth, cnt: 0, center: minV + (i + 0.5) * binWidth
                    }));
                vals.forEach(v => {
                    let idx = Math.min(binCount - 1, Math.max(0, Math.floor((v - minV) / binWidth)));
                    bins[idx].cnt++;
                });
                const entropy = -bins.reduce((s, b) => {
                    const p = b.cnt / n;
                    return s + (p > 0 ? p * Math.log2(p): 0);
                }, 0);
                const normEntropy = entropy / Math.log2(binCount);

                const lag1 = (n > 1) ? (vals.slice(1).reduce((s, v, i) => s + (v - mean) * (vals[i] - mean), 0) / (n * (std ** 2))): 0;

                const xVals = Array.from({
                    length: n
                }, (_, i) => i);
                const sumX = xVals.reduce((a, b) => a + b, 0);
                const sumY = vals.reduce((a, b) => a + b, 0);
                const sumXY = xVals.reduce((s, x, i) => s + x * vals[i], 0);
                const sumX2 = xVals.reduce((s, x) => s + x * x, 0);
                const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
                const intercept = (sumY - slope * sumX) / n;
                const yPred = xVals.map(x => intercept + slope * x);
                const ssRes = vals.reduce((s, v, i) => s + (v - yPred[i]) ** 2, 0);
                const ssTot = vals.reduce((s, v) => s + (v - mean) ** 2, 0);
                const rSquared = ssTot > 0 ? 1 - ssRes / ssTot: 1;
                const linearNext = intercept + slope * n;

                const isStructured = (normEntropy < 0.25 && Math.abs(lag1) > 0.8 && rSquared > 0.9);
                let prediction,
                mode,
                confidence;

                // ✅ Declare grid and cdf in the outer scope
                let grid = [];
                let cdf = [];

                if (isStructured) {
                    mode = 'deterministic';
                    prediction = linearNext;
                    confidence = 90 + Math.floor(rSquared * 10);
                    if (prediction < 1.00) prediction = 1.01;
                } else {
                    mode = 'random';
                    const bw = 0.5 * std * Math.pow(n, -0.2);
                    const gridN = 150;
                    const gridMin = Math.max(1.00, minV - 2 * bw);
                    const gridMax = Math.min(upper, maxV + 2 * bw);
                    grid = []; // re‑assign, not redeclare
                    for (let i = 0; i <= gridN; i++) {
                        const x = gridMin + (i / gridN) * (gridMax - gridMin);
                        let density = 0;
                        for (const v of vals) {
                            const u = (x - v) / bw;
                            density += Math.exp(-0.5 * u * u);
                        }
                        density /= (n * bw * Math.sqrt(2 * Math.PI));
                        grid.push({
                            x, density
                        });
                    }
                    let totalDensity = grid.reduce((s, p) => s + p.density, 0);
                    if (totalDensity === 0) totalDensity = 1;
                    let cum = 0;
                    cdf = grid.map(p => {
                        cum += p.density / totalDensity; return {
                            x: p.x, cumProb: cum
                        };
                    });
                    const r = Math.random();
                    let sampledX = grid[grid.length - 1].x;
                    for (const point of cdf) {
                        if (r <= point.cumProb) {
                            sampledX = point.x; break;
                        }
                    }
                    prediction = sampledX;
                    const count1 = vals.filter(v => v === 1.00).length;
                    if (Math.abs(prediction - 1.00) < 0.001 && count1 / n < 0.3) prediction = 1.01;
                    if (prediction < 1.00) prediction = 1.01;
                    if (upper !== Infinity) prediction = Math.min(upper, prediction);
                    prediction = Math.round(prediction * 100) / 100;
                    confidence = Math.round((1 - normEntropy) * 70 + 15);
                }

                confidence = Math.min(95, Math.max(10, confidence));
                return {
                    mode,
                    prediction,
                    confidence,
                    linearNext,
                    grid,
                    cdf,
                    normEntropy,
                    lag1,
                    rSquared,
                    upper
                };
            }

            function sampleRandomFromState(state) {
                if (!state || state.mode !== 'random') return state.prediction;
                const r = Math.random();
                let sampledX = state.grid[state.grid.length - 1].x;
                for (const point of state.cdf) {
                    if (r <= point.cumProb) {
                        sampledX = point.x; break;
                    }
                }
                const vals = history.map(h => h.value);
                const count1 = vals.filter(v => v === 1.00).length;
                if (Math.abs(sampledX - 1.00) < 0.001 && count1 / vals.length < 0.3) sampledX = 1.01;
                if (sampledX < 1.00) sampledX = 1.01;
                if (state.upper !== Infinity) sampledX = Math.min(state.upper, sampledX);
                return Math.round(sampledX * 100) / 100;
            }

            function updatePredictionDisplay(state) {
                if (!state) {
                    predictionValue.textContent = 'Need 16 entries';
                    predictionValue.classList.add('no-prediction');
                    confidenceRow.style.display = 'none';
                    modelBadge.style.display = 'none';
                    rerollBtn.style.display = 'none';
                    detailHint.textContent = '';
                    return;
                }
                predictionValue.textContent = fmt(state.prediction);
                predictionValue.classList.remove('no-prediction');
                confidenceRow.style.display = 'flex';
                confidenceBar.style.width = state.confidence + '%';
                confidencePercent.textContent = state.confidence + '%';
                modelBadge.style.display = 'inline-block';
                modelText.textContent = state.mode === 'deterministic' ? 'structured (linear extrapolation)': 'random (distribution sampling)';
                rerollBtn.style.display = (state.mode === 'random') ? 'inline-block': 'none';
                detailHint.textContent = state.mode === 'deterministic' ?
                `R²=${state.rSquared.toFixed(3)} | lag1=${state.lag1.toFixed(2)} | entropy=${state.normEntropy.toFixed(2)}`:
                `entropy=${state.normEntropy.toFixed(2)} | sampled from KDE density`;
            }

            function computeAndUpdate() {
                if (history.length < 16) {
                    lastPredictionState = null;
                    updatePredictionDisplay(null);
                    return;
                }
                lastPredictionState = buildPredictionState();
                if (lastPredictionState) {
                    // prediction already set inside state, but for random we might want to resample on each update?
                    // We'll keep the initial sample, re‑roll button will resample.
                    updatePredictionDisplay(lastPredictionState);
                }
            }

            function updateAll() {
                const n = history.length;
                statCount.textContent = n;
                if (n === 0) {
                    statMedian.textContent = statMode.textContent = statStd.textContent = statEntropy.textContent = statAutocorr.textContent = '—';
                } else {
                    const vals = history.map(h => h.value);
                    const sorted = [...vals].sort((a, b) => a - b);
                    statMedian.textContent = fmt(n % 2 ? sorted[Math.floor(n / 2)]: (sorted[n / 2 - 1] + sorted[n / 2]) / 2);
                    const freq = {}; vals.forEach(v => freq[fmt(v)] = (freq[fmt(v)] || 0) + 1);
                    statMode.textContent = Object.entries(freq).sort((a, b) => b[1] - a[1])[0][0];
                    const mean = vals.reduce((s, v) => s + v, 0) / n;
                    const std = Math.sqrt(vals.reduce((s, v) => s + (v - mean) ** 2, 0) / n);
                    statStd.textContent = fmt(std);
                    const binCount = Math.min(15, Math.max(4, Math.floor(Math.sqrt(n))));
                    const minV = sorted[0],
                    maxV = sorted[n - 1],
                    range = maxV - minV || 1;
                    const bins = Array(binCount).fill(0);
                    vals.forEach(v => {
                        let idx = Math.min(binCount - 1, Math.floor((v - minV) / (range / binCount))); bins[idx]++;
                    });
                    const entropy = -bins.reduce((s, c) => {
                        const p = c / n; return s + (p ? p * Math.log2(p): 0);
                    }, 0);
                    statEntropy.textContent = entropy.toFixed(2);
                    const lag1 = n > 1 ? (vals.slice(1).reduce((s, v, i) => s + (v - mean) * (vals[i] - mean), 0) / (n * (std ** 2))).toFixed(2): '—';
                    statAutocorr.textContent = lag1;
                }
                computeAndUpdate();
                renderHistory();
                updateLimitStatus();
            }

            function renderHistory() {
                const items = getVisible();
                historyList.innerHTML = items.length ? '': '<li style="text-align:center;color:var(--text-muted);padding:30px;">No data</li>';
                items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'history-item' + (isEditMode ? ' editable': '');
                    li.dataset.gi = item.gi;
                    li.innerHTML = `<span class="history-index">#${item.gi+1}</span><span class="history-value">${fmt(item.value)}</span><span class="history-time">${item.timestamp}</span><span class="history-actions"><button class="btn-inline-edit" data-act="edit">✏️</button><button class="btn-inline-delete" data-act="del">✕</button></span>`;
                    if (isEditMode) li.addEventListener('click', e => {
                        if (e.target.dataset.act) return; document.querySelectorAll('.selected-for-edit').forEach(el => el.classList.remove('selected-for-edit')); li.classList.add('selected-for-edit'); editTarget = item.gi;
                    });
                    li.querySelector('[data-act="edit"]').addEventListener('click',
                        e => {
                            e.stopPropagation(); openEdit(item.gi);
                        });
                    li.querySelector('[data-act="del"]').addEventListener('click',
                        e => {
                            e.stopPropagation(); del(item.gi);
                        });
                    historyList.appendChild(li);
                });
                historyRangeLabel.textContent = `Latest ${isViewing32 ? Math.min(32, history.length): Math.min(10, history.length)}`;
                viewToggleBtn.textContent = isViewing32 ? '🔍 View 10': '🔍 View 32';
            }

            function updateLimitStatus() {
                if (infinityCheckbox.checked) {
                    limitStatus.textContent = 'No upper bound'; submitBtn.disabled = false;
                } else {
                    const lim = parseInt(limitInput.value) || 0;
                    const cur = history.length;
                    if (lim > 0 && cur >= lim) {
                        limitStatus.textContent = `Limit reached (${cur}/${lim})`; submitBtn.disabled = true;
                    } else if (lim > 0) {
                        limitStatus.textContent = `${cur}/${lim} used`; submitBtn.disabled = false;
                    } else {
                        limitStatus.textContent = 'Set valid limit'; submitBtn.disabled = false;
                    }
                }
            }

            function submit() {
                const raw = numberInput.value.trim();
                if (!raw) return showToast('Enter a number', 'warning');
                let num = parseFloat(raw);
                if (isNaN(num) || num < 1.00) return showToast('Minimum 1.00', 'warning');
                num = Math.round(num * 100) / 100;
                if (num < 1.00) num = 1.01;
                if (!infinityCheckbox.checked) {
                    const lim = parseInt(limitInput.value) || 0;
                    if (lim > 0 && history.length >= lim) return showToast('Limit reached', 'danger');
                }
                history.push({
                    value: num, timestamp: nowTime()
                });
                if (history.length > 88) {
                    history.splice(0, 32); showToast('Auto-cleaned 32 oldest entries', 'info');
                }
                numberInput.value = '';
                numberInput.focus();
                updateAll();
                showToast(`Submitted ${fmt(num)}`, 'success');
            }

            function rerollPrediction() {
                if (!lastPredictionState || lastPredictionState.mode !== 'random') return;
                const newVal = sampleRandomFromState(lastPredictionState);
                predictionValue.textContent = fmt(newVal);
                showToast(`🎲 Resampled: ${fmt(newVal)}`, 'info');
            }

            function openEdit(idx) {
                editTarget = idx; editModalIndex.textContent = '#' + (idx + 1); editModalInput.value = fmt(history[idx].value); editModal.style.display = 'flex'; editModalInput.focus();
            }
            function saveEdit() {
                if (editTarget === null) return;
                let num = parseFloat(editModalInput.value);
                if (isNaN(num) || num < 1.00) return showToast('Min 1.00', 'warning');
                num = Math.round(num * 100) / 100;
                if (num < 1.00) num = 1.01;
                history[editTarget].value = num;
                history[editTarget].timestamp = nowTime() + ' (edited)';
                closeEdit();
                updateAll();
            }
            function closeEdit() {
                editModal.style.display = 'none'; editTarget = null;
            }
            function del(idx) {
                history.splice(idx, 1); updateAll();
            }
            function clearAll() {
                confirmCount.textContent = history.length + ' entries'; confirmModal.style.display = 'flex';
            }
            function confirmClear() {
                history = []; isEditMode = false; confirmModal.style.display = 'none'; updateAll();
            }
            function toggleView() {
                isViewing32 = !isViewing32; updateAll();
            }

            // Events
            submitBtn.addEventListener('click', submit);
            numberInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') submit();
            });
            infinityCheckbox.addEventListener('change',
                () => {
                    limitInput.disabled = infinityCheckbox.checked; updateLimitStatus();
                });
            limitInput.addEventListener('input',
                updateLimitStatus);
            viewToggleBtn.addEventListener('click',
                toggleView);
            editToggleBtn.addEventListener('click',
                () => {
                    isEditMode = !isEditMode; updateAll();
                });
            clearBtn.addEventListener('click',
                clearAll);
            rerollBtn.addEventListener('click',
                rerollPrediction);
            editModalSave.addEventListener('click',
                saveEdit);
            editModalCancel.addEventListener('click',
                closeEdit);
            confirmYes.addEventListener('click',
                confirmClear);
            confirmNo.addEventListener('click',
                () => confirmModal.style.display = 'none');
            document.addEventListener('keydown',
                e => {
                    if (e.key === 'Escape') {
                        if (editModal.style.display === 'flex') closeEdit(); if (confirmModal.style.display === 'flex') confirmModal.style.display = 'none'; if (isEditMode) {
                            isEditMode = false; updateAll();
                        }
                    }
                    if (e.ctrlKey && e.key === 'z' && !isEditMode && history.length) {
                        e.preventDefault(); history.pop(); updateAll();
                    }
                });

            limitInput.disabled = true;
            updateAll();
            numberInput.focus();
        })();
    </script>
</body>
</html>
